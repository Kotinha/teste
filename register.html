<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - JuntaPlay</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="scripts.js"></script>
</head>
<body>
  <header>
    <h1>Cadastre-se</h1>
  </header>
  <main>
    <form id="registerForm" onsubmit="register(event)">
      <label>Nome:<br><input type="text" name="nome" required /></label><br>
      <label>Email:<br><input type="email" name="email" required /></label><br>
      <label>Senha:<br><input type="password" name="senha" required /></label><br>
      <label>Telefone:<br><input type="tel" name="telefone" required /></label><br>
      <label>CPF:<br><input type="text" name="cpf" required /></label><br>
      <fieldset>
        <legend>Tipo de Usuário</legend>
        <label><input type="checkbox" name="membro" /> Membro</label>
        <label><input type="checkbox" name="administrador" /> Administrador</label>
      </fieldset>
      <button type="submit">Registrar</button>
    </form>
    <p>Já tem conta? <a href="login.html">Faça login</a></p>
  </main>
</body>
</html>
